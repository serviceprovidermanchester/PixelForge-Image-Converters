name: ✨ Feature Request
description: Propose a new image converter, codec enhancement, or architectural capability.
title: "[FEATURE]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make **PixelForge** even better? We welcome proposals that maintain our **Zero-Server-Upload** privacy standard.
        Maintained by [SPManchester Private Limited](https://www.spmanchester.com).
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear description of what the friction or limitation is.
      placeholder: Currently, animated GIF to animated WebP is not supported client-side...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the Solution You'd Like
      description: Detailed explanation of how this should work.
      placeholder: Integrate a lightweight WebAssembly binary to decode and re-encode animation frames...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe Alternatives You've Considered
      description: Any alternative solutions or workarounds you've tested.
